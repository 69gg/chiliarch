[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chiliarch"
version = "0.1.0"
description = "An outbound-only agent orchestration platform with a first-class AI supervisor."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Null", email = "pylindex@qq.com" }]
keywords = ["agents", "orchestration", "ai", "webui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "aiosqlite>=0.20,<1",
  "anyio>=4.6,<5",
  "httpx>=0.28,<1",
  "websockets>=14,<17",
  "openai>=1.68,<3",
  "anthropic>=0.49,<1",
  "tomli-w>=1.2,<2",
  "jsonschema>=4.23,<5",
  "packaging>=24.2",
  "mcp>=1.30,<2",
  "filelock>=3.18,<4",
]

[project.scripts]
chiliarch = "chiliarch.cli:main"

[project.urls]
Repository = "https://github.com/69gg/chiliarch"
Documentation = "https://github.com/69gg/chiliarch/tree/main/docs"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-jsonschema>=4.23",
  "build>=1.2,<2",
  "twine>=6,<7",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/chiliarch"]
exclude = ["src/chiliarch/static/**"]

[tool.hatch.build.targets.wheel.force-include]
"src/chiliarch/static" = "chiliarch/static"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/web", "/scripts", "/tests", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/.python-version"]
exclude = ["web/node_modules", "web/coverage", "web/.vite", "**/__pycache__", "src/chiliarch/static/**"]

[tool.hatch.build.targets.sdist.force-include]
"src/chiliarch/static" = "src/chiliarch/static"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
